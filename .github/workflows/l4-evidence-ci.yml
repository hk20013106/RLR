name: L4 evidence CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l4-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope / docs fast path
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify change scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="full"
          else
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
            changed="$RUNNER_TEMP/changed-files.txt"
            : > "$changed"
            if [[ -z "$base" || -z "$head" ]]; then
              mode="full"
            elif ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
              mode="full"
            else
              git diff --name-only "$base" "$head" > "$changed"
              mode="$(python3 tools/ci_change_scope.py < "$changed")"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "L4 CI scope: $mode"

  targeted:
    name: Targeted runtime + L4 / Windows / Python 3.13
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: rlr
          init-shell: powershell
          cache-environment: true
      - name: Install test dependencies
        run: micromamba run -n rlr python -m pip install -r requirements-specter2.txt -r requirements-dev.txt
      - name: Compile affected modules
        run: >-
          micromamba run -n rlr python -m py_compile
          src/research_loop/deep_research.py
          src/research_loop/deep_research_task.py
          src/research_loop/provider_runtime_observability.py
          src/research_loop/source_payload_integrity.py
          src/research_loop/l4_method_registry.py
          src/research_loop/l4_registry_projection_integrity.py
          src/research_loop/l4_inventory.py
          src/research_loop/l4_inventory_projection.py
          src/research_loop/l4_evidence_bundle.py
          src/research_loop/l4_runtime_compat.py
          src/research_loop/l4_closed_corpus.py
          src/research_loop/l4_pipeline.py
          src/research_loop/method_contracts.py
      - name: Run targeted provider runtime tests
        run: >-
          micromamba run -n rlr python -m pytest -q
          tests/test_provider_runtime_observability.py
          tests/test_provider_runtime_integration.py
          tests/test_deep_research.py
      - name: Run targeted L4 tests
        run: >-
          micromamba run -n rlr python -m pytest -q
          tests/test_deep_research_persistence_integrity.py
          tests/test_l4b_persisted_byte_integrity.py
          tests/test_l4_real_pilot_integrity.py
          tests/test_l4_method_registry.py
          tests/test_l4_inventory_schema.py
          tests/test_l4_inventory_projection.py
          tests/test_l4_evidence_bundle.py
          tests/test_l4b_to_l4c_context.py
          tests/test_l4_runtime_compat.py
          tests/test_method_evidence_card_contracts.py
          tests/test_method_decision_contracts.py
          tests/test_l4b_closed_corpus_fulltext.py
          tests/test_l4_pipeline.py
          tests/test_l4_method_anchors.py
          tests/test_l4_source_blocked_catalog.py
          tests/test_l4_provenance_hardening.py
          tests/test_l4_provenance_regressions.py
          tests/test_l4_path_safety.py
          tests/test_l45_context_binding.py
          tests/test_l45_ledger.py
          tests/test_l45_ledger_integration.py

  full-suite:
    name: Full suite / Windows / Python 3.13
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: rlr
          init-shell: powershell
          cache-environment: true
      - name: Install test dependencies
        run: micromamba run -n rlr python -m pip install -r requirements-specter2.txt -r requirements-dev.txt
      - name: Run full regression suite
        run: micromamba run -n rlr python -m pytest -q
      - name: Check patch whitespace
        shell: pwsh
        run: |
          $base = "${{ github.base_ref }}"
          if ([string]::IsNullOrWhiteSpace($base)) {
            $base = "codex/l4a-source-metadata-contract"
          }
          git fetch origin $base
          git diff --check "origin/$base...HEAD"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
