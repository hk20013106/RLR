name: Goal11 profile purity GREEN

on:
  push:
    branches:
      - codex/full-dag-authority-closure
    paths:
      - .github/workflows/goal11-profile-purity-green.yml

permissions:
  contents: write

jobs:
  patch-and-green:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-dag-authority-closure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Reuse readonly ledger profile authority in closure gate
        shell: python
        run: |
          from pathlib import Path

          ledger = Path("src/research_loop/commands/ledger.py")
          text = ledger.read_text(encoding="utf-8")
          old = '''def _ledger_for(project_dir, configured_path=None, *, require_binding=True):\n    \"\"\"Construct the configured ledger without permitting a silent fallback.\"\"\"\n    store_path = configured_path or os.environ.get(\"RLR_HYPOTHESIS_STORE\")\n    if not store_path:\n        raise LedgerError(\"hypothesis ledger requires --knowledge-store or RLR_HYPOTHESIS_STORE\")\n    if require_binding and not Path(store_path).is_file():\n        raise LedgerError(f\"configured hypothesis ledger does not exist: {store_path}\")\n    ledger = HypothesisLedger(store_path)\n    if require_binding:\n        ledger.require_activated_project(project_dir)\n    return ledger\n'''
          new = '''def _ledger_for(\n    project_dir, configured_path=None, *, require_binding=True, readonly=False\n):\n    \"\"\"Construct the configured ledger without permitting a silent fallback.\"\"\"\n    store_path = configured_path or os.environ.get(\"RLR_HYPOTHESIS_STORE\")\n    if not store_path:\n        raise LedgerError(\"hypothesis ledger requires --knowledge-store or RLR_HYPOTHESIS_STORE\")\n    if require_binding and not Path(store_path).is_file():\n        raise LedgerError(f\"configured hypothesis ledger does not exist: {store_path}\")\n    ledger = (\n        HypothesisLedger.open_readonly(store_path)\n        if readonly else HypothesisLedger(store_path)\n    )\n    if require_binding:\n        ledger.require_activated_project(project_dir)\n    return ledger\n'''
          assert text.count(old) == 1, "ledger constructor anchor drifted"
          ledger.write_text(text.replace(old, new), encoding="utf-8")

          runner = Path("src/run_loop.py")
          text = runner.read_text(encoding="utf-8")
          old = '''    try:\n        profile_id = next_step(project, cand).get(\"profile_id\", PROFILE_V20)\n        from research_loop import pre_e2e_closure\n        closure = pre_e2e_closure.audit_static_closure(profile_id)\n'''
          new = '''    try:\n        if rl.binding_path(project).exists():\n            profile_id = rl._ledger_for(\n                project, getattr(args, \"knowledge_store\", None), readonly=True\n            ).project_profile(project)\n        else:\n            profile_id = PROFILE_V20\n        from research_loop import pre_e2e_closure\n        closure = pre_e2e_closure.audit_static_closure(profile_id)\n'''
          assert text.count(old) == 1, "runner closure-profile anchor drifted"
          runner.write_text(text.replace(old, new), encoding="utf-8")

          guards = Path("tests/test_run_loop_guards.py")
          text = guards.read_text(encoding="utf-8")
          old = '''sys.path.insert(0, str(Path(__file__).parent))\nimport run_loop\n'''
          new = '''sys.path.insert(0, str(Path(__file__).parent))\nimport run_loop\nfrom research_loop.compatibility import PROFILE_V21_CATALOG_1\nfrom research_loop.hypothesis_ledger import HypothesisLedger\n'''
          assert text.count(old) == 1, "run-loop guard import anchor drifted"
          text = text.replace(old, new)
          old = '''        with tempfile.TemporaryDirectory() as d:\n            project = Path(d)\n            candidates = project / \"01_Candidates\"\n            candidates.mkdir()\n'''
          new = '''        with tempfile.TemporaryDirectory() as d:\n            project = Path(d)\n            store = project / \"hypotheses.sqlite\"\n            HypothesisLedger(store).bind_project(\n                project, profile_id=PROFILE_V21_CATALOG_1\n            )\n            candidates = project / \"01_Candidates\"\n            candidates.mkdir(exist_ok=True)\n'''
          assert text.count(old) == 1, "main-agent fixture anchor drifted"
          text = text.replace(old, new)
          old = '''                project_dir=str(project), cand_id=\"C1\", config=None,\n                max_rounds=None, dry_run=False, no_review=False,\n                provider=None, resume=False, stop_after_node=\"L1\")\n'''
          new = '''                project_dir=str(project), cand_id=\"C1\", config=None,\n                knowledge_store=str(store), max_rounds=None, dry_run=False,\n                no_review=False, provider=None, resume=False,\n                stop_after_node=\"L1\")\n'''
          assert text.count(old) == 1, "main-agent args anchor drifted"
          guards.write_text(text.replace(old, new), encoding="utf-8")
      - name: Targeted architecture regressions
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q --no-header -p no:cacheprovider \
            tests/test_full_dag_authority_closure.py \
            tests/test_run_loop_guards.py \
            tests/test_hypothesis_ledger.py \
            tests/test_profile_aware_consumers.py
      - name: Verify minimal ownership-preserving diff
        shell: python
        run: |
          from pathlib import Path
          runner = Path("src/run_loop.py").read_text(encoding="utf-8")
          ledger = Path("src/research_loop/commands/ledger.py").read_text(encoding="utf-8")
          old_closure = '''    try:\n        profile_id = next_step(project, cand).get(\"profile_id\", PROFILE_V20)\n        from research_loop import pre_e2e_closure\n        closure = pre_e2e_closure.audit_static_closure(profile_id)\n'''
          new_closure = '''    try:\n        if rl.binding_path(project).exists():\n            profile_id = rl._ledger_for(\n                project, getattr(args, \"knowledge_store\", None), readonly=True\n            ).project_profile(project)\n        else:\n            profile_id = PROFILE_V20\n        from research_loop import pre_e2e_closure\n        closure = pre_e2e_closure.audit_static_closure(profile_id)\n'''
          assert old_closure not in runner
          assert runner.count(new_closure) == 1
          assert "HypothesisLedger.open_readonly(store_path)" in ledger
      - name: Diff check and commit
        run: |
          git diff --check
          git diff -- src/run_loop.py src/research_loop/commands/ledger.py tests/test_run_loop_guards.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/run_loop.py src/research_loop/commands/ledger.py tests/test_run_loop_guards.py
          git commit -m "fix: resolve closure profile from readonly ledger"
          git push origin HEAD:codex/full-dag-authority-closure
