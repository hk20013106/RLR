name: R3 process architecture migration

on:
  push:
    branches:
      - codex/pr38-r3-provider-executor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr38-r3-provider-executor
      - name: Migrate PaperQA2 and legacy tests
        shell: python
        run: |
          from pathlib import Path

          # PaperQA2 is an external retrieval process, not a provider authority.
          path = Path("src/research_loop/l05_curie/paperqa2_runtime.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import subprocess\n", "", 1)
          anchor = "from pathlib import Path\n\nfrom .contracts import CurieContractError\n"
          replacement = (
              "from pathlib import Path\n\n"
              "from research_loop.process_runner import DEFAULT_PROCESS_RUNNER, ProcessRunner\n\n"
              "from .contracts import CurieContractError\n"
          )
          if anchor not in text:
              raise SystemExit("missing PaperQA2 import anchor")
          text = text.replace(anchor, replacement, 1)

          old_sig = '''        pqa_home: str | Path,\n        timeout_seconds: int = 300,\n    ) -> None:\n'''
          new_sig = '''        pqa_home: str | Path,\n        timeout_seconds: int = 300,\n        runner: ProcessRunner | None = None,\n    ) -> None:\n'''
          if old_sig not in text:
              raise SystemExit("missing PaperQA2 constructor signature")
          text = text.replace(old_sig, new_sig, 1)
          assign_anchor = "        self.backend_id = PAPERQA2_BACKEND_ID\n"
          if assign_anchor not in text:
              raise SystemExit("missing PaperQA2 backend assignment")
          text = text.replace(
              assign_anchor,
              assign_anchor + "        self.runner = runner or DEFAULT_PROCESS_RUNNER\n",
              1,
          )

          hit = text.find("            completed = subprocess.run(")
          if hit < 0:
              raise SystemExit("missing PaperQA2 subprocess owner")
          start = text.rfind("        try:\n", 0, hit)
          end = text.find("        if completed.returncode != 0:", hit)
          if start < 0 or end < 0:
              raise SystemExit("missing PaperQA2 invocation boundaries")
          new_call = '''        try:\n            completed = self.runner.run(\n                [str(self.python_executable), str(self.bridge_script)],\n                cwd=str(self.paperqa_repo),\n                env=environment,\n                input_text=json.dumps(request, ensure_ascii=False),\n                timeout=self.timeout_seconds,\n                encoding="utf-8",\n                errors="strict",\n            )\n        except OSError as exc:\n            raise CurieContractError(\n                f"PaperQA2 subprocess could not start: {exc}"\n            ) from exc\n        if completed.terminal_state == "timed_out":\n            raise CurieContractError("PaperQA2 subprocess timed out")\n'''
          text = text[:start] + new_call + text[end:]
          path.write_text(text, encoding="utf-8")

          # This test is about L4 schema writing/non-zero propagation, not subprocess internals.
          path = Path("tests/test_deep_research.py")
          text = path.read_text(encoding="utf-8")
          old = '    monkeypatch.setattr(dr.subprocess, "run", lambda *args, **kwargs: _Completed())\n'
          new = '    monkeypatch.setattr(dr, "execute_provider_invocation", lambda *args, **kwargs: _Completed())\n'
          if old not in text:
              raise SystemExit("missing legacy Deep Research subprocess monkeypatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research_loop/l05_curie/paperqa2_runtime.py tests/test_deep_research.py
          git rm .github/workflows/r3-process-architecture-migration.yml
          git commit -m "refactor: finish shared process boundary migration"
          git push origin HEAD:codex/pr38-r3-provider-executor
