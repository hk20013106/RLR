name: L0.5 Curie contract CI

on:
  push:
    paths:
      - "src/research_loop/l05_curie/**"
      - "src/research_loop/l05_context.py"
      - "src/research_loop/l05_curie_cli.py"
      - "src/research_loop/l05_native_binding.py"
      - "src/research_loop/l05_native_context_gate.py"
      - "src/research_loop/research_seed.py"
      - "src/research_loop/context.py"
      - "src/research_loop/__init__.py"
      - "tests/test_l05_curie_*.py"
      - "tests/test_l05_native_*.py"
      - ".github/workflows/l05-curie-ci.yml"
  pull_request:
    paths:
      - "src/research_loop/l05_curie/**"
      - "src/research_loop/l05_context.py"
      - "src/research_loop/l05_curie_cli.py"
      - "src/research_loop/l05_native_binding.py"
      - "src/research_loop/l05_native_context_gate.py"
      - "src/research_loop/research_seed.py"
      - "src/research_loop/context.py"
      - "src/research_loop/__init__.py"
      - "tests/test_l05_curie_*.py"
      - "tests/test_l05_native_*.py"
      - ".github/workflows/l05-curie-ci.yml"

concurrency:
  group: l05-curie-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts / Ubuntu / Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: L0.5 contract suite
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest
          tests/test_l05_curie_contracts.py
          tests/test_l05_curie_store.py
          tests/test_l05_curie_l1_bridge.py
          tests/test_l05_curie_europepmc_discovery.py
          tests/test_l05_curie_europepmc_evidence.py
          tests/test_l05_curie_europepmc_runtime.py
          tests/test_l05_curie_gap_loop.py
          tests/test_l05_curie_native_runtime.py
          tests/test_l05_curie_multisource_discovery.py
          tests/test_l05_curie_canonical_identity_integration.py
          tests/test_l05_curie_provenance_hardening.py
          tests/test_l05_curie_selector.py
          tests/test_l05_curie_paperqa2.py
          tests/test_l05_curie_paperqa2_runtime.py
          tests/test_l05_curie_source_verifier.py
          tests/test_l05_curie_semantic_verifier.py
          tests/test_l05_curie_fullcycle.py
          tests/test_l05_native_evidence_binding.py
          tests/test_l05_native_l1_handoff.py
          -q