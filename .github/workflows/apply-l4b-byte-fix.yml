name: Apply staged L4B byte fix

on:
  push:
    branches:
      - refactor/l4-evidence-design

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/l4-evidence-design
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact production patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def block(*lines):
              return "\n".join(lines) + "\n"

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          bundle_path = Path("src/research_loop/l4_evidence_bundle.py")
          text = bundle_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              block(
                  '        payload = str(result.get("source_payload") or "")',
                  '        methods = result.get("methods_section") or None',
              ),
              block(
                  '        payload = str(result.get("source_payload") or "")',
                  '        raw_source_bytes = result.get("source_bytes")',
                  '        payload_bytes = (',
                  '            bytes(raw_source_bytes)',
                  '            if isinstance(raw_source_bytes, (bytes, bytearray))',
                  '            else payload.encode("utf-8")',
                  '        )',
                  '        payload_hash = _sha(payload_bytes) if payload_bytes else ""',
                  '        methods = result.get("methods_section") or None',
              ),
              "bundle payload bytes",
          )
          text = replace_once(
              text,
              block('            source_file.write_text(payload, encoding="utf-8")'),
              block('            source_file.write_bytes(payload_bytes)'),
              "bundle source write",
          )
          text = replace_once(
              text,
              block('                "source_hash": _sha(payload),'),
              block('                "source_hash": payload_hash,'),
              "bundle extract hash",
          )
          old_content_hash = block('                "content_hash": _sha(payload),')
          if text.count(old_content_hash) != 2:
              raise SystemExit("bundle content hashes: expected two matches")
          text = text.replace(
              old_content_hash,
              block('                "content_hash": payload_hash,'),
          )
          text = replace_once(
              text,
              block(
                  '        payload = source_path.read_text(encoding="utf-8")',
                  '        if _sha(payload) != str(card.get("content_hash") or ""):',
                  '            return False, f"L4B evidence card {card_id} content hash mismatch"',
              ),
              block(
                  '        try:',
                  '            payload_bytes = source_path.read_bytes()',
                  '            payload = payload_bytes.decode("utf-8")',
                  '        except (OSError, UnicodeDecodeError):',
                  '            return False, f"L4B evidence card {card_id} source payload is unreadable"',
                  '        payload_hash = _sha(payload_bytes)',
                  '        if payload_hash != str(record.get("content_hash") or ""):',
                  '            return False, f"L4B evidence card {card_id} paper content hash mismatch"',
                  '        if payload_hash != str(card.get("content_hash") or ""):',
                  '            return False, f"L4B evidence card {card_id} content hash mismatch"',
              ),
              "bundle byte audit",
          )
          text = replace_once(
              text,
              block(
                  '        if not extract:',
                  '            return False, f"L4B evidence card {card_id} extract is missing"',
                  '        text = str(extract.get("text") or "")',
              ),
              block(
                  '        if not extract:',
                  '            return False, f"L4B evidence card {card_id} extract is missing"',
                  '        if str(extract.get("source_hash") or "") != payload_hash:',
                  '            return False, f"L4B evidence card {card_id} extract source hash mismatch"',
                  '        text = str(extract.get("text") or "")',
              ),
              "bundle extract audit",
          )
          text = replace_once(
              text,
              block(
                  '        if _sha(receipt_path.read_bytes()) != str(record.get("retrieval_receipt_sha256") or ""):',
                  '            return False, f"L4B evidence card {card_id} retrieval receipt hash mismatch"',
              ),
              block(
                  '        if _sha(receipt_path.read_bytes()) != str(record.get("retrieval_receipt_sha256") or ""):',
                  '            return False, f"L4B evidence card {card_id} retrieval receipt hash mismatch"',
                  '        try:',
                  '            receipt_data = json.loads(receipt_path.read_text(encoding="utf-8"))',
                  '        except (OSError, json.JSONDecodeError):',
                  '            return False, f"L4B evidence card {card_id} retrieval receipt is unreadable"',
                  '        selected_attempt = receipt_data.get("selected_attempt") or {}',
                  '        if str(selected_attempt.get("content_hash") or "") != payload_hash:',
                  '            return False, f"L4B evidence card {card_id} receipt content hash mismatch"',
                  '        try:',
                  '            receipt_byte_length = int(selected_attempt.get("byte_length"))',
                  '        except (TypeError, ValueError):',
                  '            return False, f"L4B evidence card {card_id} receipt byte count is invalid"',
                  '        if receipt_byte_length != len(payload_bytes):',
                  '            return False, f"L4B evidence card {card_id} receipt byte count mismatch"',
              ),
              "bundle receipt audit",
          )
          bundle_path.write_text(text, encoding="utf-8", newline="\n")

          resolver_path = Path("src/research_loop/l4_closed_corpus.py")
          text = resolver_path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              block(
                  '                "source_payload": payload,',
                  '                "content_type": receipt["content_type"],',
              ),
              block(
                  '                "source_payload": payload,',
                  '                "source_bytes": body,',
                  '                "content_type": receipt["content_type"],',
              ),
              "resolver resolved bytes",
          )
          text = replace_once(
              text,
              block(
                  '        "source_payload": "",',
                  '        "content_type": "",',
              ),
              block(
                  '        "source_payload": "",',
                  '        "source_bytes": b"",',
                  '        "content_type": "",',
              ),
              "resolver failed bytes",
          )
          text = replace_once(
              text,
              block('            path.write_text(result["source_payload"], encoding="utf-8")'),
              block(
                  '            source_bytes = result.get("source_bytes")',
                  '            path.write_bytes(',
                  '                bytes(source_bytes)',
                  '                if isinstance(source_bytes, (bytes, bytearray))',
                  '                else result["source_payload"].encode("utf-8")',
                  '            )',
              ),
              "resolver handoff write",
          )
          resolver_path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -
      - name: Commit production fix and remove temporary workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-l4b-byte-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research_loop/l4_evidence_bundle.py src/research_loop/l4_closed_corpus.py .github/workflows/apply-l4b-byte-fix.yml
          git diff --cached --check
          git commit -m "fix: preserve staged L4B source bytes"
          git push origin HEAD:refactor/l4-evidence-design
