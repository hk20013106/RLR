name: R3 ProviderExecutor RED

on:
  push:
    branches:
      - codex/pr38-r3-provider-executor

jobs:
  focused-red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_provider_executor.py
        env:
          PYTHONPATH: src
