name: Apply static closure gate

on:
  push:
    branches:
      - codex/full-dag-authority-closure
    paths:
      - .github/workflows/apply-static-closure-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-dag-authority-closure

      - name: Patch canonical runner gate
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/run_loop.py")
          text = path.read_text(encoding="utf-8")
          needle = "    if not preflight_providers(cfg, args):\n"
          assert text.count(needle) == 1, "canonical provider preflight boundary must be unique"
          gate = '''    try:\n        profile_id = next_step(project, cand).get("profile_id", PROFILE_V20)\n        from research_loop import pre_e2e_closure\n        closure = pre_e2e_closure.audit_static_closure(profile_id)\n    except Exception as exc:\n        log(f"STATIC CLOSURE AUDIT FAILED -- halting before provider startup: {exc}")\n        return 3\n    if not closure.get("e2e_start_allowed", False):\n        log("STATIC CLOSURE OPEN -- halting before provider startup:")\n        for item in closure.get("unresolved_required_paths") or []:\n            log(f"  {json.dumps(item, ensure_ascii=False, sort_keys=True)}")\n        return 3\n\n'''
          path.write_text(text.replace(needle, gate + needle), encoding="utf-8")

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          grep -n "STATIC CLOSURE OPEN" src/run_loop.py
          grep -n "audit_static_closure" src/run_loop.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/run_loop.py
          git commit -m "fix: enforce static closure before provider startup"
          git push origin HEAD:codex/full-dag-authority-closure
