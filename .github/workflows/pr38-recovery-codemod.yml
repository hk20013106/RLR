name: PR38 recovery codemod

on:
  push:
    branches:
      - codex/l1-kb-authority-single-source

permissions:
  contents: write

jobs:
  recover:
    if: github.event.head_commit.message == 'chore: run PR38 recovery codemod'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/l1-kb-authority-single-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run architecture recovery codemod
        shell: bash
        run: python scripts/pr38_recovery_codemod.py
      - name: Commit verified recovery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'refactor: absorb PR39 and converge provider authority'
          git push origin HEAD:codex/l1-kb-authority-single-source
