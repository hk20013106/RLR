name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope / docs fast path
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify change scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$CURRENT_SHA"
          else
            base=""
            head=""
          fi

          changed="$RUNNER_TEMP/changed-files.txt"
          : > "$changed"
          if [[ -z "$base" || -z "$head" || "$base" =~ ^0+$ ]]; then
            mode="full"
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null || ! git cat-file -e "$head^{commit}" 2>/dev/null; then
            mode="full"
          else
            git diff --name-only "$base" "$head" > "$changed"
            mode="$(python3 tools/ci_change_scope.py < "$changed")"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CI scope: $mode"

          if [[ "$mode" == "docs-only" ]]; then
            git diff --check "$base" "$head"
          fi

  test:
    name: Test / Windows / Python 3.13
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Import check
        run: python -c "import sys; sys.path.insert(0, 'src'); import research_loop"

      - name: CLI help
        run: python research_loop_v04.py --help

      # research_loop_v04.py has no packaging metadata (no setup.py/pyproject.toml);
      # it self-installs src/ onto sys.path, so pytest needs the same PYTHONPATH to
      # import research_loop the same way the CLI does.
      - name: Test suite with coverage
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q --no-header -p no:cacheprovider \
            --cov=src --cov-report=term-missing | tee pytest-output.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage — Windows / Python 3.13"
            echo '```'
            grep -A 1000 "^Name " pytest-output.txt || echo "(coverage table not found)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
