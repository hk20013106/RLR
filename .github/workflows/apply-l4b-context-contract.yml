name: Apply L4B context contract

on:
  push:
    branches:
      - refactor/l4-evidence-design

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/l4-evidence-design
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact producer-contract patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path("src/research_loop/l4_evidence_bundle.py")
          text = path.read_text(encoding="utf-8")

          marker = 'EVIDENCE_BUNDLE_SCHEMA = "L4BEvidenceBundle/v2"\nDETERMINISTIC_RECEIPT_SCHEMA = "DeterministicResolverReceipt/v2"'
          replacement = 'EVIDENCE_BUNDLE_SCHEMA = "L4BEvidenceBundle/v2"\nEVIDENCE_RECEIPT_SCHEMA = "EvidenceRunReceipt/v1.1"\nDETERMINISTIC_RECEIPT_SCHEMA = "DeterministicResolverReceipt/v2"'
          if text.count(marker) != 1:
              raise SystemExit(f"schema constants: expected one match, found {text.count(marker)}")
          text = text.replace(marker, replacement, 1)

          start_marker = "def _render_summary(artifact: dict) -> str:\n"
          end_marker = "\n\ndef run_l4b_evidence("
          if text.count(start_marker) != 1:
              raise SystemExit("summary renderer start is not unique")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_renderer = textwrap.dedent('''\
          def _render_summary(artifact: dict) -> str:
              papers = artifact.get("papers") or []
              cards = artifact.get("evidence_cards") or []
              gaps = artifact.get("evidence_gaps") or []
              receipt = artifact.get("skill_receipt") or {}

              identifiers = []
              for paper in papers:
                  paper_id = str(paper.get("paper_id") or paper.get("asset_id") or "source")
                  doi = str(paper.get("doi") or "").strip()
                  pmid = str(paper.get("pmid") or "").strip()
                  url = str(paper.get("url") or "").strip()
                  if doi:
                      identifier = f"doi:{doi}"
                  elif pmid:
                      identifier = f"PMID:{pmid}"
                  elif url:
                      identifier = url
                  else:
                      identifier = paper_id
                  identifiers.append(f"{paper_id} ({identifier})")

              card_digest = ", ".join(
                  f"{card['evidence_card_id']}(method={card['method_id']})"
                  for card in cards
              ) or "none"
              gap_digest = ", ".join(
                  f"{gap['evidence_gap_id']}(method={gap['method_id']})"
                  for gap in gaps
              ) or "none"
              source_digest = ", ".join(identifiers) or "none"

              lines = [
                  "# Pre-Research: L4",
                  "",
                  "## Runtime digest",
                  f"Deterministic L4B evidence bundle `{artifact['run_id']}`.",
                  f"Sources: {source_digest}.",
                  "L4B retrieves exact registered sources and extracts evidence; L4C defines method components, candidates, eligibility, execution requirements, and the final plan.",
                  f"Accepted evidence cards: {card_digest}.",
                  f"Evidence gaps: {gap_digest}.",
                  "",
                  "## Evidence pack",
                  f"- {artifact['path']}",
                  "",
                  "## Query log",
              ]
              queries = [
                  str(query).strip()
                  for query in artifact.get("queries") or []
                  if str(query).strip()
              ]
              if queries:
                  lines.extend(f"- {query}" for query in queries)
              else:
                  lines.append("- deterministic exact-source resolution")

              lines.extend([
                  "",
                  "## Tool receipt",
                  (
                      f"- {receipt.get('backend') or 'deterministic'} / "
                      f"{receipt.get('skill') or 'closed-corpus-exact-source-resolver'} "
                      f"{receipt.get('skill_version') or ''}; "
                      f"command_hash={receipt.get('command_hash') or ''}; "
                      f"prompt_hash={receipt.get('prompt_hash') or ''}"
                  ),
                  "",
                  "## Source count",
                  str(len(papers)),
                  "",
                  "## Responsibility boundary",
                  "L4B retrieves exact registered sources and extracts evidence. It does not define method components, candidates, eligibility, required flags, or the final plan.",
                  "",
                  "## Accepted evidence cards",
              ])
              if cards:
                  for card in cards:
                      lines.append(
                          f"- `{card['evidence_card_id']}` method=`{card['method_id']}` "
                          f"source=`{card['source_ref_id']}` @ {card['locator']}"
                      )
              else:
                  lines.append("- none")

              lines.extend(["", "## Evidence gaps"])
              if gaps:
                  for gap in gaps:
                      lines.append(
                          f"- `{gap['evidence_gap_id']}` method=`{gap['method_id']}`: "
                          f"{gap['failure_reason']}"
                      )
              else:
                  lines.append("- none")
              lines.append("")
              return "\\n".join(lines)
          ''').rstrip()
          text = text[:start] + new_renderer + text[end:]

          old_schema = '        "evidence_receipt_schema": "EvidenceRunReceipt/v2",'
          new_schema = '        "evidence_receipt_schema": EVIDENCE_RECEIPT_SCHEMA,'
          if text.count(old_schema) != 1:
              raise SystemExit(f"artifact receipt schema: expected one match, found {text.count(old_schema)}")
          text = text.replace(old_schema, new_schema, 1)

          audit_marker = (
              '    if artifact.get("evidence_bundle_schema") != EVIDENCE_BUNDLE_SCHEMA:\n'
              '        return False, "unexpected L4B evidence bundle schema"\n'
          )
          audit_replacement = audit_marker + (
              '    if artifact.get("evidence_receipt_schema") != EVIDENCE_RECEIPT_SCHEMA:\n'
              '        return False, "unexpected L4B evidence receipt schema"\n'
          )
          if text.count(audit_marker) != 1:
              raise SystemExit(f"audit schema gate: expected one match, found {text.count(audit_marker)}")
          text = text.replace(audit_marker, audit_replacement, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-l4b-context-contract.yml").unlink()
          PY
      - name: Commit producer-contract fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research_loop/l4_evidence_bundle.py .github/workflows/apply-l4b-context-contract.yml
          git diff --cached --check
          git commit -m "fix: align staged L4B context contract"
          git push origin HEAD:refactor/l4-evidence-design
