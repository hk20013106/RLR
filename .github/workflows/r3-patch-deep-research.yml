name: R3 patch Deep Research executor

on:
  push:
    branches:
      - codex/pr38-r3-provider-executor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr38-r3-provider-executor
      - name: Route Deep Research process through ProviderExecutor only
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/research_loop/deep_research.py')
          text = path.read_text(encoding='utf-8')

          old_imports = '''import re\nimport shutil\nimport subprocess\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\n\nSCHEMA_VERSION'''
          new_imports = '''import re\nimport shutil\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nfrom research_loop.providers.executor import DEFAULT_EXECUTOR, ProviderExecutionError\n\n\nSCHEMA_VERSION'''
          if old_imports not in text:
              raise SystemExit('Deep Research import anchor not found')
          text = text.replace(old_imports, new_imports, 1)

          old = '''    try:\n        completed = subprocess.run(execution_command, capture_output=True, text=True,\n                                   encoding="utf-8", errors="strict",\n                                   timeout=spec.timeout, check=False, **invocation_kwargs)\n    except (OSError, subprocess.SubprocessError) as exc:\n        raise DeepResearchError(f"Academic Research CLI invocation failed: {exc}") from exc\n    receipt = skill_receipt(spec.backend, command, prompt, skill_version,\n                            exit_code=completed.returncode, stdout_hash=_sha(completed.stdout),\n                            model=spec.model)\n    if completed.returncode != 0:\n        raise DeepResearchError(f"Academic Research CLI exited {completed.returncode}: {completed.stderr.strip()}")\n'''
          new = '''    try:\n        completed = DEFAULT_EXECUTOR.run(\n            execution_command,\n            timeout=spec.timeout,\n            input_text=invocation_kwargs.get("input"),\n            check=False,\n            encoding="utf-8",\n            errors="strict",\n        )\n    except ProviderExecutionError as exc:\n        detail = exc.stderr.strip() or str(exc)\n        if exc.timed_out:\n            raise DeepResearchError(\n                f"Academic Research CLI timed out after {exc.timeout}s: {detail}"\n            ) from exc\n        raise DeepResearchError(\n            f"Academic Research CLI invocation failed: {detail}"\n        ) from exc\n    receipt = skill_receipt(\n        spec.backend,\n        command,\n        prompt,\n        skill_version,\n        exit_code=completed.returncode,\n        stdout_hash=_sha(completed.stdout),\n        model=spec.model,\n    )\n    if completed.returncode != 0:\n        raise DeepResearchError(\n            f"Academic Research CLI exited {completed.returncode}: {completed.stderr.strip()}"\n        )\n'''
          if old not in text:
              raise SystemExit('Deep Research subprocess block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit narrow patch and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/r3-patch-deep-research.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research_loop/deep_research.py
          git commit -m "refactor: route Deep Research through ProviderExecutor"
          git push origin HEAD:codex/pr38-r3-provider-executor
