name: Cleanup accidental file

on:
  push:
    branches:
      - refactor/l4-evidence-design

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/l4-evidence-design
          fetch-depth: 0
      - name: Remove accidental file
        shell: pwsh
        run: |
          if (-not (Test-Path NONEXISTENT -PathType Leaf)) {
            throw "Expected accidental file NONEXISTENT is missing"
          }
          git rm -- NONEXISTENT
          Remove-Item .github/workflows/cleanup-accidental-nonexistent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/cleanup-accidental-nonexistent.yml
          git diff --cached --check
          git commit -m "chore: remove accidental repository file"
          git push origin HEAD:refactor/l4-evidence-design
