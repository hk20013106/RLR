name: Apply deep research byte fix

on:
  push:
    branches:
      - refactor/l4-evidence-design

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/l4-evidence-design
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact persistence patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/research_loop/deep_research.py')
          text = path.read_text(encoding='utf-8')
          old = '''        source_path = ""
                  source_payload = str(paper.get("source_payload") or "")
                  if paper.get("open_access") and source_payload:
                      ext = ".html" if "html" in str(paper.get("content_type", "")).lower() else ".txt"
                      source_file = sources_dir / f"{paper_id}{ext}"
                      source_file.write_text(source_payload, encoding="utf-8")
                      source_path = str(source_file.relative_to(project_dir)).replace("\\\\", "/")
                  extracts = []
          '''
          new = '''        source_path = ""
                  source_payload = str(paper.get("source_payload") or "")
                  source_bytes = source_payload.encode("utf-8")
                  source_hash = hashlib.sha256(source_bytes).hexdigest() if source_bytes else ""
                  if paper.get("open_access") and source_payload:
                      content_type = str(paper.get("content_type", "")).casefold()
                      if "xml" in content_type or "jats" in content_type:
                          ext = ".xml"
                      elif "html" in content_type:
                          ext = ".html"
                      else:
                          ext = ".txt"
                      source_file = sources_dir / f"{paper_id}{ext}"
                      source_file.write_bytes(source_bytes)
                      source_path = str(source_file.relative_to(project_dir)).replace("\\\\", "/")
                  extracts = []
          '''
          old_hash = '                "source_hash": _sha(source_payload) if source_payload else "",\n'
          new_hash = '                "source_hash": source_hash,\n'
          old_record = '            "open_access": bool(paper.get("open_access")), "content_hash": _sha(source_payload) if source_payload else "",\n'
          new_record = '            "open_access": bool(paper.get("open_access")), "content_hash": source_hash,\n'

          if old not in text:
              raise SystemExit('canonical source persistence block did not match exactly')
          if text.count(old_hash) != 1:
              raise SystemExit(f'expected one extract source_hash assignment, found {text.count(old_hash)}')
          if text.count(old_record) != 1:
              raise SystemExit(f'expected one record content_hash assignment, found {text.count(old_record)}')

          text = text.replace(old, new, 1)
          text = text.replace(old_hash, new_hash, 1)
          text = text.replace(old_record, new_record, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Commit production fix
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/research_loop/deep_research.py
          if git diff --cached --quiet; then
            echo 'No production change generated.'
            exit 1
          fi
          git commit -m 'fix: persist canonical source payload as exact bytes'
          git push origin HEAD:refactor/l4-evidence-design
