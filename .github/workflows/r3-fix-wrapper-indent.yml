name: R3 wrapper indentation repair

on:
  push:
    branches:
      - codex/pr38-r3-provider-executor

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr38-r3-provider-executor
      - name: Repair wrapper indentation
        shell: python
        run: |
          from pathlib import Path

          for path in (
              Path("src/research_loop/method_evidence.py"),
              Path("src/research_loop/method_review_navigation.py"),
          ):
              text = path.read_text(encoding="utf-8")
              old = '''        completed = dr.execute_provider_invocation(\n        execution_command, invocation_kwargs, timeout=spec.timeout,\n        label='Academic Research CLI',\n    )\n    receipt = dr.skill_receipt(\n'''
              new = '''        completed = dr.execute_provider_invocation(\n            execution_command, invocation_kwargs, timeout=spec.timeout,\n            label="Academic Research CLI",\n        )\n        receipt = dr.skill_receipt(\n'''
              if old not in text:
                  raise SystemExit(f"missing malformed migration block in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Compile repaired modules
        run: python -m py_compile src/research_loop/method_evidence.py src/research_loop/method_review_navigation.py
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/research_loop/method_evidence.py src/research_loop/method_review_navigation.py
          git rm .github/workflows/r3-fix-wrapper-indent.yml
          git commit -m "fix: repair centralized provider wrapper indentation"
          git push origin HEAD:codex/pr38-r3-provider-executor
